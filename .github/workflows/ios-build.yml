name: Build LARYN for iPhone

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Standard hosted runners are free for public repositories. Skip private ones.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Check Xcode
        run: xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Check app logic
        run: npm test
      - name: Bundle the app and sync native plugins
        run: npm run ios:sync
      - name: Build an unsigned iPhone app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios-build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee artifacts/xcode-build.log
      - name: Package and verify the IPA
        run: python3 scripts/package-ipa.py ios-build/Build/Products/Release-iphoneos/App.app
      - name: Downloadable app package
        uses: actions/upload-artifact@v4
        with:
          name: LARYN-iPhone-unsigned
          path: artifacts/LARYN-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
      - name: Build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LARYN-build-log
          path: artifacts/xcode-build.log
          if-no-files-found: ignore
          retention-days: 7
